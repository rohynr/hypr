name: Poller

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/poller-once.mjs
      - name: Run classifier until complete
        run: |
          while true; do
            output=$(node scripts/classifier.mjs)
            echo "$output"
            if echo "$output" | grep -q "No pending articles"; then
              break
            fi
          done
      - name: Run image fetcher until complete
        run: |
          while true; do
            output=$(node scripts/image_fetcher.mjs)
            echo "$output"
            if echo "$output" | grep -qE "No articles without images|Found images: 0"; then
              break
            fi
          done
